[package]
name = "matrix-openrouter-helpdesk"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5.53", features = ["derive", "env"] }
handlebars = "6.3.2"
matrix-sdk = { version = "0.16.0", default-features = false, features = ["automatic-room-key-forwarding", "e2e-encryption", "rustls-tls", "bundled-sqlite"] }
metrics = "0.24.3"
metrics-exporter-prometheus = "0.18.1"
miette = { version = "7.6.0", features = ["fancy"] }
rand = "0.9.2"
reqwest = { version = "0.12.26", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
tracing-subscriber = "0.3"
