name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: cargo test --all-features

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy -- -D warnings

  container-image:
    name: Container Image
    runs-on: ubuntu-latest
    needs:
      - code-quality

    steps:
      - uses: actions/checkout@v4

      - name: Build container image
        run: podman build -f Containerfile -t matrix-openrouter-helpdesk:latest .
